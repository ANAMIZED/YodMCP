name: CI

on:
  push:
    branches: [main, master, production-prep]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install aiosqlite cryptography opentelemetry-api opentelemetry-sdk

      - name: Unit + production tests (in-memory)
        env:
          YODMCP_MEMORY_BACKEND: memory
          YODMCP_ATTEST_MODE: software
        run: |
          PYTHONPATH=src pytest tests/ -v --tb=short

      - name: Durable store + simulated TEE + auth tests
        env:
          YODMCP_MEMORY_BACKEND: sqlite
          YODMCP_MEMORY_DB: /tmp/yodmcp_ci_memory.db
          YODMCP_SYSTEM_DB: /tmp/yodmcp_ci_system.db
          YODMCP_TASKS_BACKEND: sqlite
          YODMCP_METER_BACKEND: sqlite
          YODMCP_AUDIT_BACKEND: sqlite
          YODMCP_ATTEST_MODE: simulated_tee
        run: |
          PYTHONPATH=src pytest tests/ -v --tb=short
          PYTHONPATH=src python scripts/verify_e2e.py

      - name: E2E verification (in-memory + software attest)
        env:
          YODMCP_MEMORY_BACKEND: memory
          YODMCP_ATTEST_MODE: software
        run: |
          PYTHONPATH=src python scripts/verify_e2e.py
