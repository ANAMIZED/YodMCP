name: CI

on:
  push:
    branches: [main, master, production-prep]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit + SaaS tests (in-memory)
        env:
          YODMCP_MEMORY_BACKEND: memory
          YODMCP_ATTEST_MODE: software
        run: |
          PYTHONPATH=src pytest tests/ -v --tb=short --timeout=30

      - name: Durable + multi-tenant + TEE tests
        env:
          YODMCP_MEMORY_BACKEND: sqlite
          YODMCP_MEMORY_DB: ${{ runner.temp }}/yodmcp_ci_memory.db
          YODMCP_SYSTEM_DB: ${{ runner.temp }}/yodmcp_ci_system.db
          YODMCP_TASKS_BACKEND: sqlite
          YODMCP_METER_BACKEND: sqlite
          YODMCP_AUDIT_BACKEND: sqlite
          YODMCP_ATTEST_MODE: simulated_tee
        run: |
          PYTHONPATH=src pytest tests/ -v --tb=short --timeout=30
          PYTHONPATH=src python scripts/verify_e2e.py

      - name: E2E verification (in-memory)
        env:
          YODMCP_MEMORY_BACKEND: memory
          YODMCP_ATTEST_MODE: software
        run: |
          PYTHONPATH=src python scripts/verify_e2e.py

      - name: Dependency audit (best-effort SBOM hygiene)
        continue-on-error: true
        run: |
          pip install pip-audit -q
          pip-audit || true
          pip freeze > sbom-requirements.txt
          echo "Captured pip freeze as lightweight SBOM artifact"

      - name: Upload freeze SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-requirements-py${{ matrix.python-version }}
          path: sbom-requirements.txt
          if-no-files-found: ignore
